name: Проверка веб-страниц t.me

# Служебная проверка: как публичная веб-страница t.me показывает пост-розыгрыш и
# сколько страниц подряд t.me отдаёт без ограничений. Запуск только вручную.
on:
  workflow_dispatch:
    inputs:
      post:
        description: "Пост вида канал/номер — показать его разметку"
        type: string
        default: "otdel34/382"
      walk:
        description: "Канал для замера скорости: листать его историю назад"
        type: string
        default: "giveaways_database"
      pages:
        description: "Сколько страниц листать"
        type: string
        default: "150"
      parallel:
        description: "Сколько запросов одновременно"
        type: string
        default: "8"
      doc_url:
        description: "Страница, в которой искать слово (пусто — пропустить)"
        type: string
        default: ""
      grep:
        description: "Что искать на странице (регулярное выражение)"
        type: string
        default: "giveaway"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POST: ${{ inputs.post }}
      WALK: ${{ inputs.walk }}
      PAGES: ${{ inputs.pages }}
      PARALLEL: ${{ inputs.parallel }}
      DOC_URL: ${{ inputs.doc_url }}
      GREP: ${{ inputs.grep }}
    steps:
      - name: Поиск слова на странице
        if: inputs.doc_url != ''
        run: |
          python3 - <<'EOF'
          import html, os, re, urllib.request
          for url in os.environ["DOC_URL"].split():
              raw = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=20).read().decode("utf-8", "replace")
              text = html.unescape(re.sub(r"<[^>]+>", " ", raw))
              text = re.sub(r"[ \t]+", " ", text)
              hits = [m.start() for m in re.finditer(os.environ["GREP"], text, flags=re.I)]
              print("=====", url, "chars", len(text), "hits", len(hits))
              last = -1000
              for i in hits:
                  if i - last < 300:
                      continue
                  last = i
                  print("…", re.sub(r"\s+", " ", text[max(0, i - 200): i + 250]).strip(), "…")
          EOF

      - name: Разметка поста
        run: |
          python3 - <<'EOF'
          import os, re, urllib.request
          post = os.environ["POST"].strip().strip("/")
          url = f"https://t.me/s/{post}"
          html = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=20).read().decode("utf-8", "replace")
          i = html.find(f'data-post="{post}"')
          print(url, "bytes", len(html), "found" if i >= 0 else "no post")
          if i >= 0:
              block = re.sub(r"<svg.*?</svg>|<img[^>]*>", "", html[i:i + 6000], flags=re.S)
              print(re.sub(r"\s+", " ", block)[:1500])
          EOF

      - name: Замер скорости t.me
        run: |
          python3 - <<'EOF'
          import os, re, time, urllib.request, urllib.error
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor
          chan, pages, par = os.environ["WALK"].strip("@ /"), int(os.environ["PAGES"]), int(os.environ["PARALLEL"])
          def get(url):
              t = time.time()
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=20)
                  return r.status, r.read().decode("utf-8", "replace"), time.time() - t
              except urllib.error.HTTPError as e:
                  return e.code, "", time.time() - t
              except Exception as e:
                  return str(type(e).__name__), "", time.time() - t
          code, html, _ = get(f"https://t.me/s/{chan}")
          ids = [int(x) for x in re.findall(rf'data-post="{re.escape(chan)}/(\d+)"', html, flags=re.I)]
          print("first page", code, "posts", len(ids), "top id", max(ids) if ids else None)
          top = max(ids)
          befores = [top + 1 - 20 * k for k in range(pages) if top + 1 - 20 * k > 1]
          t0 = time.time()
          with ThreadPoolExecutor(par) as ex:
              res = list(ex.map(lambda b: get(f"https://t.me/s/{chan}?before={b}"), befores))
          dt = time.time() - t0
          codes = Counter(r[0] for r in res)
          posts = stubs = 0
          dates = []
          for c, h, _ in res:
              for blk in h.split('class="tgme_widget_message_wrap')[1:]:
                  posts += 1
                  if "message_media_not_supported" in blk:
                      stubs += 1
                      m = re.search(r'datetime="([^"]+)"', blk)
                      if m: dates.append(m.group(1)[:10])
          print(f"pages {len(res)} in {dt:.1f}s ({len(res)/dt:.1f}/s), codes {dict(codes)}")
          print(f"posts {posts}, stub posts (unsupported media) {stubs}")
          print("stub dates (newest first):", sorted(set(dates), reverse=True)[:15])
          avg = sum(r[2] for r in res) / max(len(res), 1)
          print(f"avg request {avg:.2f}s")
          EOF
