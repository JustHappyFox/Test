name: Проверка веб-страниц t.me

# Служебная проверка: как публичная веб-страница t.me показывает пост-розыгрыш и
# сколько страниц подряд t.me отдаёт без ограничений. Запуск только вручную.
on:
  workflow_dispatch:
    inputs:
      post:
        description: "Пост вида канал/номер — показать его разметку"
        type: string
        default: "otdel34/382"
      walk:
        description: "Канал для замера скорости: листать его историю назад"
        type: string
        default: "giveaways_database"
      pages:
        description: "Сколько страниц листать"
        type: string
        default: "150"
      parallel:
        description: "Сколько запросов одновременно"
        type: string
        default: "8"
      doc_url:
        description: "Страница, в которой искать слово (пусто — пропустить)"
        type: string
        default: ""
      grep:
        description: "Что искать на странице (регулярное выражение)"
        type: string
        default: "giveaway"
      rank:
        description: "Каналы через пробел — посчитать у каждого модули-розыгрыши за 31 день"
        type: string
        default: ""
      cc:
        description: "Common Crawl: «снимок блоков выборка», напр. «CC-MAIN-2026-43 300 3000» (пусто — пропустить)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POST: ${{ inputs.post }}
      WALK: ${{ inputs.walk }}
      PAGES: ${{ inputs.pages }}
      PARALLEL: ${{ inputs.parallel }}
      DOC_URL: ${{ inputs.doc_url }}
      GREP: ${{ inputs.grep }}
      RANK: ${{ inputs.rank }}
      CC: ${{ inputs.cc }}
    steps:
      - uses: actions/checkout@v4
        if: inputs.rank != '' || inputs.cc != ''
      - uses: actions/setup-python@v5
        if: inputs.rank != '' || inputs.cc != ''
        with:
          python-version: "3.12"
      - name: Каналы из Common Crawl и доля каналов с модулями-розыгрышами
        if: inputs.cc != ''
        run: |
          pip install -q aiohttp
          set -- $CC
          python tools/cc_telegram.py --crawl "$1" --max-blocks "${2:-300}" --out cc_usernames.txt
          SAMPLE="${3:-3000}" python - <<'EOF'
          import asyncio, os, sys, time
          from datetime import datetime, timedelta, timezone
          sys.path.insert(0, ".")
          import tg_web_preview as wp

          names = [l.strip().lstrip("@") for l in open("cc_usernames.txt", encoding="utf-8") if l.strip()]
          sample = names[: int(os.environ["SAMPLE"])]
          since = datetime.now(timezone.utc) - timedelta(days=31)

          async def main():
              w = wp.WebPreview(parallel=8)
              t0 = time.time()
              res = await asyncio.gather(*(w.candidates(u, since, max_pages=3) for u in sample))
              await w.close()
              web = [r for r in res if r is not None]
              hits = sorted(((len(r), u) for u, r in zip(sample, res) if r), reverse=True)
              print(f"Выборка {len(sample)} из {len(names)} имён: веб-страница есть у {len(web)}, "
                    f"с модулями-кандидатами за 31 день — {len(hits)}; страниц {w.pages}, 429: {w.limited}, "
                    f"{time.time() - t0:.0f} с")
              for n, u in hits[:60]:
                  print(f"  @{u}: {n}")

          asyncio.run(main())
          EOF
      - uses: actions/upload-artifact@v4
        if: inputs.cc != ''
        with:
          name: cc-usernames
          path: cc_usernames.txt
          retention-days: 7
      - name: Оценить каналы-кандидаты в агрегаторы
        if: inputs.rank != ''
        run: |
          pip install -q aiohttp
          python - <<'EOF'
          import asyncio, os, sys
          from datetime import datetime, timedelta, timezone
          sys.path.insert(0, ".")
          import tg_web_preview as wp

          async def main():
              w = wp.WebPreview(parallel=6)
              since = datetime.now(timezone.utc) - timedelta(days=31)
              names = list(dict.fromkeys(os.environ["RANK"].replace(",", " ").split()))

              async def one(u):
                  url, got = w.BASE + u, []
                  for _ in range(5):
                      html = await w.fetch(url)
                      posts = wp.parse_page(html) if html else None
                      if not posts:
                          break
                      got += posts
                      oldest = min(posts, key=lambda p: p.id)
                      if oldest.date and oldest.date < since:
                          break
                      url = f"{w.BASE}{u}?before={oldest.id}"
                  if not got:
                      return u, None
                  recent = [p for p in got if p.date and p.date >= since]
                  newest = max((p.date for p in got if p.date), default=None)
                  return u, (len(recent), sum(p.stub for p in recent), newest)

              res = await asyncio.gather(*(one(u.lstrip("@")) for u in names))
              await w.close()
              res.sort(key=lambda r: -(r[1][1] if r[1] else -1))
              for u, r in res:
                  if r is None:
                      print(f"{u:30s} нет веб-страницы")
                  else:
                      last = r[2].strftime("%Y-%m-%d") if r[2] else "?"
                      print(f"{u:30s} постов за 31 день {r[0]:4d} | модулей-кандидатов {r[1]:4d} | последний пост {last}")
              print("страниц", w.pages, "429:", w.limited)

          asyncio.run(main())
          EOF

      - name: Поиск слова на странице
        if: inputs.doc_url != ''
        run: |
          python3 - <<'EOF'
          import html, os, re, urllib.request
          for url in os.environ["DOC_URL"].split():
              raw = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=20).read().decode("utf-8", "replace")
              text = html.unescape(re.sub(r"<[^>]+>", " ", raw))
              text = re.sub(r"[ \t]+", " ", text)
              if os.environ["GREP"].strip() in ("", "-"):  # «-» — показать весь текст страницы
                  raw = re.sub(r"(?is)<(script|style|svg)[^>]*>.*?</\1>", " ", raw)
                  text = html.unescape(re.sub(r"<[^>]+>", " ", raw))
                  text = re.sub(r"\s+", " ", text).strip()
                  print("=====", url, "chars", len(text))
                  for i in range(0, min(len(text), 80000), 400):
                      print("|", text[i:i + 400])
                  continue
              hits = [m.start() for m in re.finditer(os.environ["GREP"], text, flags=re.I)]
              print("=====", url, "chars", len(text), "hits", len(hits))
              last = -1000
              for i in hits:
                  if i - last < 300:
                      continue
                  last = i
                  print("…", re.sub(r"\s+", " ", text[max(0, i - 200): i + 250]).strip(), "…")
          EOF

      - name: Разметка поста
        run: |
          python3 - <<'EOF'
          import os, re, urllib.request
          post = os.environ["POST"].strip().strip("/")
          url = f"https://t.me/s/{post}"
          html = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=20).read().decode("utf-8", "replace")
          i = html.find(f'data-post="{post}"')
          print(url, "bytes", len(html), "found" if i >= 0 else "no post")
          if i >= 0:
              block = re.sub(r"<svg.*?</svg>|<img[^>]*>", "", html[i:i + 6000], flags=re.S)
              print(re.sub(r"\s+", " ", block)[:1500])
          EOF

      - name: Замер скорости t.me
        run: |
          python3 - <<'EOF'
          import os, re, time, urllib.request, urllib.error
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor
          chan, pages, par = os.environ["WALK"].strip("@ /"), int(os.environ["PAGES"]), int(os.environ["PARALLEL"])
          def get(url):
              t = time.time()
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=20)
                  return r.status, r.read().decode("utf-8", "replace"), time.time() - t
              except urllib.error.HTTPError as e:
                  return e.code, "", time.time() - t
              except Exception as e:
                  return str(type(e).__name__), "", time.time() - t
          code, html, _ = get(f"https://t.me/s/{chan}")
          ids = [int(x) for x in re.findall(rf'data-post="{re.escape(chan)}/(\d+)"', html, flags=re.I)]
          print("first page", code, "posts", len(ids), "top id", max(ids) if ids else None)
          top = max(ids)
          befores = [top + 1 - 20 * k for k in range(pages) if top + 1 - 20 * k > 1]
          t0 = time.time()
          with ThreadPoolExecutor(par) as ex:
              res = list(ex.map(lambda b: get(f"https://t.me/s/{chan}?before={b}"), befores))
          dt = time.time() - t0
          codes = Counter(r[0] for r in res)
          posts = stubs = 0
          dates = []
          for c, h, _ in res:
              for blk in h.split('class="tgme_widget_message_wrap')[1:]:
                  posts += 1
                  if "message_media_not_supported" in blk:
                      stubs += 1
                      m = re.search(r'datetime="([^"]+)"', blk)
                      if m: dates.append(m.group(1)[:10])
          kinds = Counter()
          examples = {}
          for c, h, _ in res:
              for blk in h.split('class="tgme_widget_message_wrap')[1:]:
                  if "message_media_not_supported" not in blk:
                      continue
                  pid = re.search(r'data-post="([^"]+)"', blk)
                  head = re.search(r'class="tgme_widget_message ([^"]*)"', blk)
                  label = re.search(r'message_media_not_supported_label">([^<]*)<', blk)
                  feats = (
                      "text" if "tgme_widget_message_text" in blk else "no-text",
                      "fwd" if "tgme_widget_message_forwarded_from" in blk else "own",
                      "media:" + ",".join(sorted(set(re.findall(r"tgme_widget_message_(photo|video|document|voice|roundvideo|sticker|poll|location|service)", blk)))),
                      (head.group(1).split(" js-")[0] if head else ""),
                      (label.group(1).strip() if label else ""),
                  )
                  kinds[feats] += 1
                  if feats not in examples:
                      examples[feats] = pid.group(1) if pid else "?"
          print("STUB KINDS:")
          for k, n in kinds.most_common(12):
              print(f"  {n:4d}  {k}  e.g. {examples[k]}")
          print(f"pages {len(res)} in {dt:.1f}s ({len(res)/dt:.1f}/s), codes {dict(codes)}")
          print(f"posts {posts}, stub posts (unsupported media) {stubs}")
          print("stub dates (newest first):", sorted(set(dates), reverse=True)[:15])
          avg = sum(r[2] for r in res) / max(len(res), 1)
          print(f"avg request {avg:.2f}s")
          EOF
