name: Веб-проверка большого списка каналов

# Проходит весь state/cc_usernames.txt по публичным веб-страницам t.me/s/… (без аккаунта Telegram)
# и сохраняет в state/cc_candidates.txt каналы, где за последний месяц есть посты-заглушки,
# похожие на модуль-розыгрыш. Поиск потом открывает через API только эти каналы.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Проверить только первые N каналов (0 — все)"
        type: string
        default: "0"
      source:
        description: "Какой список проверять (state/cc_candidates.txt — перепроверить кандидатов)"
        type: string
        default: "state/cc_usernames.txt"
      offset:
        description: "Начать с имени №N+1 (большой список — частями)"
        type: string
        default: "0"
      merge:
        description: "Добавить к уже найденным кандидатам, а не заменять список"
        type: boolean
        default: false
  schedule:
    - cron: "41 4 7 * *"   # 7-го числа, после ежемесячного обновления списка

concurrency:
  group: cc-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      LIMIT: ${{ inputs.limit || '0' }}
      SOURCE: ${{ inputs.source || 'state/cc_usernames.txt' }}
      OFFSET: ${{ inputs.offset || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q aiohttp
      - name: Проверить каналы по веб-страницам
        run: |
          python tools/web_scan.py "$SOURCE" --out /tmp/scan_result.txt --limit "$LIMIT" --offset "$OFFSET"
          # для слияния: какие имена проверены в этой части (строки прежнего списка по ним заменяются)
          tail -n +$((OFFSET + 1)) "$SOURCE" | { if [ "$LIMIT" != "0" ]; then head -n "$LIMIT"; else cat; fi; } > /tmp/scanned_names.txt
      - name: Сохранить в репозиторий
        env:
          MERGE: ${{ inputs.merge && '1' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main  # свежий список: пока шла проверка, его могли обновить
            if [ -n "$MERGE" ]; then
              python tools/web_scan.py /tmp/scanned_names.txt --combine /tmp/scan_result.txt state/cc_candidates.txt
            else
              cp /tmp/scan_result.txt state/cc_candidates.txt
            fi
            git add state/cc_candidates.txt
            if git diff --cached --quiet; then echo "Список не изменился"; exit 0; fi
            git commit -qm "Web scan of the big channel list: $(wc -l < state/cc_candidates.txt) channels with giveaway-like posts"
            git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
