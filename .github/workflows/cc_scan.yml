name: Веб-проверка большого списка каналов

# Проходит весь state/cc_usernames.txt по публичным веб-страницам t.me/s/… (без аккаунта Telegram)
# и сохраняет в state/cc_candidates.txt каналы, где за последний месяц есть посты-заглушки,
# похожие на модуль-розыгрыш. Поиск потом открывает через API только эти каналы.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Проверить только первые N каналов (0 — все)"
        type: string
        default: "0"
  schedule:
    - cron: "41 4 7 * *"   # 7-го числа, после ежемесячного обновления списка

concurrency:
  group: cc-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LIMIT: ${{ inputs.limit || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q aiohttp
      - name: Проверить каналы по веб-страницам
        run: python tools/web_scan.py state/cc_usernames.txt --out state/cc_candidates.txt --limit "$LIMIT"
      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/cc_candidates.txt
          if git diff --cached --quiet; then echo "Список не изменился"; exit 0; fi
          git commit -m "Web scan of the big channel list: $(wc -l < state/cc_candidates.txt) channels with giveaway-like posts"
          git pull --rebase -q origin main
          git push
