name: Обновить большой список каналов (Common Crawl)

# Раз в месяц собирает @username публичных каналов из трёх последних снимков Common Crawl
# (общедоступный архив интернета) и кладёт их в state/cc_usernames.txt. Репост проверяет эти каналы
# по веб-странице t.me/s/… понемногу, по кругу. Аккаунт Telegram здесь не используется.
on:
  schedule:
    - cron: "17 3 6 * *"   # 6-го числа каждого месяца
  workflow_dispatch:
    inputs:
      crawls:
        description: "Снимки через пробел (пусто — три последних из collinfo.json)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CRAWLS: ${{ inputs.crawls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать список
        run: |
          if [ -z "$CRAWLS" ]; then
            CRAWLS=$(python - <<'EOF'
          import json, time, urllib.request
          for i in range(5):
              try:
                  data = json.load(urllib.request.urlopen("https://index.commoncrawl.org/collinfo.json", timeout=60))
                  print(" ".join(c["id"] for c in data[:3]))
                  break
              except Exception:
                  time.sleep(10 * (i + 1))
          EOF
            )
          fi
          echo "Снимки: ${CRAWLS:-по умолчанию}"
          python tools/cc_telegram.py --out state/cc_usernames.txt ${CRAWLS:+--crawl $CRAWLS}
          wc -l state/cc_usernames.txt
      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/cc_usernames.txt
          if git diff --cached --quiet; then echo "Список не изменился"; exit 0; fi
          git commit -m "Update the Common Crawl channel list ($(wc -l < state/cc_usernames.txt) usernames)"
          git push
