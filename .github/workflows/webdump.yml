name: Код поста на сайте t.me

# Служебная проверка (идея владельца 06.11): выкачать полный код модуля-розыгрыша на сайте t.me
# и сравнить с другими «заглушками». Аккаунт Telegram не используется. Запуск только вручную.
on:
  workflow_dispatch:
    inputs:
      posts:
        description: "Розыгрыши: канал/номер через пробел"
        type: string
        default: "rzavayuui/43 korchaginnn/28886 otdel34/382 DuckyBBL/2151"
      stubs:
        description: "Каналы, где заглушки — не розыгрыши (уже открыты Dolli)"
        type: string
        default: "samara dva_majors today_smr fontankaspb"
      og:
        description: "Проверка og:description: сколько каналов второго уровня взять (пусто — только выкачать код)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTS: ${{ inputs.posts }}
      STUBS: ${{ inputs.stubs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp
      - name: Выкачать код
        if: inputs.og == ''
        run: python tools/web_dump.py --posts $POSTS --stubs $STUBS | tee /tmp/web_dump.txt
      - name: Проверить og:description у розыгрышей и каналов второго уровня
        if: inputs.og != ''
        env:
          OG: ${{ inputs.og }}
        run: |
          if [ "$OG" = "results" ]; then
            printf '@rzavayuui\n@energyplusmedia\n' > /tmp/known.txt
            python tools/results_scan.py /tmp/known.txt state/sources.txt state/cc_candidates.txt state/gh_usernames.txt --days 14 --stop-after 12 | tee /tmp/web_dump.txt
          elif [ "$OG" = "js" ]; then
            python tools/js_paths.py | tee /tmp/web_dump.txt
          elif [ "$OG" = "labels" ]; then
            python tools/og_check.py --labels $POSTS | tee /tmp/web_dump.txt
            python tools/og_check.py --labels-gap --gap-file state/cc_candidates.txt | tee -a /tmp/web_dump.txt
          elif [ "$OG" = "img" ]; then
            python tools/og_check.py --img $POSTS | tee /tmp/web_dump.txt
          elif [ "$OG" = "debug" ]; then
            python tools/og_check.py --debug $POSTS | tee /tmp/web_dump.txt
          elif [ "$OG" = "ua" ]; then
            python tools/og_check.py --ua-test $POSTS | tee /tmp/web_dump.txt
          else
            python tools/og_check.py --posts $POSTS --gap-file state/cc_candidates.txt --sample $OG | tee /tmp/web_dump.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: web-dump
          path: /tmp/web_dump.txt
