name: Репост розыгрышей в @TGaGifts

# Посты строго по расписанию (владелец 21.11): 07:00, 12:00, 17:00 и 22:00 по Минску — по одному.
# Задание просыпается только в эти часы. GitHub иногда пропускает или задерживает запуски,
# поэтому в каждом окне есть запасные запуски (+15, +30, +45 мин и следующий час): бот публикует
# один раз за слот, повторные запуски ничего не дублируют. Опоздавший пост выходит, если с начала
# слота прошло не больше 2 часов. После поста бот пополняет запас (поиск — раз в сутки или когда
# в запасе меньше 4). Не раньше 5 часов после поста владельца — такой слот пропускается.
# Для публичного репозитория минуты GitHub Actions бесплатны.
on:
  schedule:  # время UTC = Минск − 3 ч
    - cron: "0,15,30,45 4,9,14,19 * * *"   # 07:00, 12:00, 17:00, 22:00 по Минску (+ запасные)
    - cron: "5,35 5,10,15,20 * * *"        # ещё запасные в следующий час
  workflow_dispatch:          # ручной запуск: вкладка Actions → Run workflow
    inputs:
      refill:
        description: "Только пополнить запас розыгрышей, ничего не публикуя"
        type: boolean
        default: false
      post_now:
        description: "Опубликовать розыгрыш из запаса сейчас, вне очереди (ссылка t.me/…)"
        type: string
        default: ""
      gaps:
        description: "Партия: открыть через Dolli N новых каналов без «Канал запустил розыгрыш» (пусто — нет)"
        type: string
        default: ""

concurrency:
  group: repost
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
      TG_TRANSPORT: tcp
    steps:
      - name: Проверить, что секреты заданы
        id: check
        run: |
          if [ -n "$TG_API_ID" ] && [ -n "$TG_API_HASH" ] && [ -n "$TG_STRING_SESSION" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Секреты TG_API_ID / TG_API_HASH / TG_STRING_SESSION не заданы — пропускаю запуск"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        if: steps.check.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Восстановить состояние (что уже пересылали, найденные каналы)
        if: steps.check.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: repost-state-${{ github.run_id }}
          restore-keys: repost-state-

      - name: Начальное состояние из репозитория (первый запуск)
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p .state
          [ -f .state/posted.json ] || cp state/posted.json .state/posted.json 2>/dev/null || true

      - name: Найти и переслать розыгрыш
        if: steps.check.outputs.ready == 'true'
        run: >
          python tg_giveaway_finder.py post --to TGaGifts
          --countries RU,BY,KZ --fallback-other-countries --max-giveaway-channels 4
          --count 1 --min-hours-left 3 --post-at 7,12,17,22 --manual-gap-hours 5 --schedule-ahead 0 --reserve 10 --daily-search-hours 24 --refill-below 4 --refill-every-hours 3 --tz-offset 3
          --careful --max-channels 1000 --search-pages 2 --source-limit 100
          --web --web-max 6000 --time-limit 30
          --discover-file state/cc_candidates.txt --web-open-max 40 --no-discover
          --state .state/posted.json ${{ inputs.refill && '--refill' || '' }} ${{ inputs.post_now && format('--post-now {0}', inputs.post_now) || '' }}
          ${{ inputs.gaps && format('--refill --discover-gaps --web-open-max {0}', inputs.gaps) || '' }}

      - name: Сохранить состояние
        if: always() && steps.check.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: .state
          key: repost-state-${{ github.run_id }}
