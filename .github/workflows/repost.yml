name: Репост розыгрышей в @TGaGifts

# Каждые 30 минут задание просто обновляется: проверяет время и ваши посты, ничего не ищет.
# Раз в 3,5 часа (и не раньше 5 часов после вашего поста) публикует ОДИН розыгрыш из запаса —
# тот, что раньше закончится; пересылает из канала-организатора и записывает в учёт.
# Когда запас кончается, ищет новые перебором каналов (до 10 подходящих за поиск).
# Каналы сначала смотрит по веб-странице t.me/s/… (без аккаунта и его лимитов): модуль-розыгрыш там —
# заглушка «Please open Telegram»; через API Telegram открываются только такие посты.
# Для публичного репозитория минуты GitHub Actions бесплатны.
on:
  schedule:
    - cron: "13,43 * * * *"   # каждые 30 минут (UTC); не в :00 — меньше очередь у GitHub
  workflow_dispatch:          # ручной запуск: вкладка Actions → Run workflow
    inputs:
      refill:
        description: "Только пополнить запас розыгрышей, ничего не публикуя"
        type: boolean
        default: false
      post_now:
        description: "Опубликовать розыгрыш из запаса сейчас, вне очереди (ссылка t.me/…)"
        type: string
        default: ""

concurrency:
  group: repost
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
      TG_TRANSPORT: tcp
    steps:
      - name: Проверить, что секреты заданы
        id: check
        run: |
          if [ -n "$TG_API_ID" ] && [ -n "$TG_API_HASH" ] && [ -n "$TG_STRING_SESSION" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Секреты TG_API_ID / TG_API_HASH / TG_STRING_SESSION не заданы — пропускаю запуск"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        if: steps.check.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Восстановить состояние (что уже пересылали, найденные каналы)
        if: steps.check.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: repost-state-${{ github.run_id }}
          restore-keys: repost-state-

      - name: Начальное состояние из репозитория (первый запуск)
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p .state
          [ -f .state/posted.json ] || cp state/posted.json .state/posted.json 2>/dev/null || true
          [ -f .state/sources.txt ] || cp state/sources.txt .state/sources.txt 2>/dev/null || true

      - name: Найти и переслать розыгрыш
        if: steps.check.outputs.ready == 'true'
        run: >
          python tg_giveaway_finder.py post --to TGaGifts
          --countries RU,BY,KZ
          --count 1 --min-hours-left 3 --min-interval-hours 3.5 --manual-gap-hours 5 --schedule-ahead 0 --reserve 10
          --careful --max-channels 1000 --search-pages 2 --source-limit 500
          --web --web-max 6000 --time-limit 30
          --channels-file .state/sources.txt --save-sources .state/sources.txt
          --state .state/posted.json ${{ inputs.refill && '--refill' || '' }} ${{ inputs.post_now && format('--post-now {0}', inputs.post_now) || '' }}

      - name: Сохранить состояние
        if: always() && steps.check.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: .state
          key: repost-state-${{ github.run_id }}
