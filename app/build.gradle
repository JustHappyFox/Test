plugins {
    id 'com.android.application'
}

android {
    namespace 'by.mobilemeter'
    compileSdk 34

    defaultConfig {
        applicationId 'by.mobilemeter'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':usbserial')
}
